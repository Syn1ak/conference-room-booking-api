# Deploys master to Azure once CI has passed (ADR 0009): migrates the database first, then publishes the app.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect sign-in to Azure; no stored Azure credentials.

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until infra/provision.sh has connected the repository to Azure.
    if: vars.AZURE_WEBAPP_NAME != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Publish the app with the client
        run: dotnet publish src/ConferenceRoomBooking.Api --configuration Release --output publish

      - name: Build the migration bundle
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations bundle --configuration Release --self-contained --target-runtime linux-x64 \
            --project src/ConferenceRoomBooking.Infrastructure --startup-project src/ConferenceRoomBooking.Api \
            --output efbundle
        env:
          # Only read when the bundle is built; the real connection string is passed when it runs.
          ConnectionStrings__DefaultConnection: Server=placeholder

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open the SQL firewall to this runner
        run: |
          ip="$(curl --silent https://api.ipify.org)"
          az sql server firewall-rule create --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "${{ vars.AZURE_SQL_SERVER }}" --name "github-${{ github.run_id }}" \
            --start-ip-address "$ip" --end-ip-address "$ip" --output none

      - name: Migrate the database
        # The app's DbContext setup reads the connection string from configuration, so the bundle needs it there too.
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.SQL_CONNECTION_STRING }}
        run: ./efbundle --connection "$ConnectionStrings__DefaultConnection"

      - name: Close the SQL firewall again
        if: always()
        run: |
          az sql server firewall-rule delete --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "${{ vars.AZURE_SQL_SERVER }}" --name "github-${{ github.run_id }}" || true

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Check the app is healthy
        run: |
          # The free tiers start slowly: the app and a paused database can take a couple of minutes to wake.
          for attempt in $(seq 1 30); do
            status="$(curl --silent --max-time 60 "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health" || true)"
            [ "$status" = Healthy ] && echo "Healthy" && exit 0
            sleep 10
          done
          echo "The app didn't report Healthy in time" && exit 1
