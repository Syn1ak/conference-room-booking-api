<app-page-header
  title="Reports"
  description="How the rooms earn and fill, by booking date in venue time. Confirmed bookings count; cancelled ones show as cancellations."
/>

<app-card class="mt-8">
  <app-period-picker [period]="$period()" [today]="today" (periodChange)="showPeriod($event)" />
  <p class="mt-4 text-sm text-ink-muted" aria-live="polite">
    {{ $period().from | wallDate: 'long' }} – {{ $period().to | wallDate: 'long' }} · {{ $days() }}
    {{ $days() === 1 ? 'day' : 'days' }}
  </p>
</app-card>

<div ngTabs class="mt-8">
  <ul
    ngTabList
    class="flex gap-1 border-b border-line"
    [selectedTab]="$selectedReport()"
    (selectedTabChange)="showReport($event)"
  >
    @for (report of reports; track report.id) {
      <li
        ngTab
        [value]="report.id"
        class="-mb-px cursor-pointer rounded-t-lg border-b-2 border-transparent px-4 py-2.5 text-sm font-medium text-ink-muted outline-none hover:text-ink focus-visible:ring-2 focus-visible:ring-brand-500 aria-selected:border-brand-600 aria-selected:text-ink dark:aria-selected:border-brand-400"
      >
        {{ report.label }}
      </li>
    }
  </ul>

  <div ngTabPanel value="revenue" class="pt-6 outline-none">
    <ng-template ngTabContent><app-revenue-report [period]="$period()" /></ng-template>
  </div>
  <div ngTabPanel value="occupancy" class="pt-6 outline-none">
    <ng-template ngTabContent><app-occupancy-report [period]="$period()" /></ng-template>
  </div>
  <div ngTabPanel value="demand" class="pt-6 outline-none">
    <ng-template ngTabContent><app-demand-report [period]="$period()" /></ng-template>
  </div>
  <div ngTabPanel value="services" class="pt-6 outline-none">
    <ng-template ngTabContent><app-service-uptake-report [period]="$period()" /></ng-template>
  </div>
</div>
